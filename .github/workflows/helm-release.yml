name: Helm Chart Release

on:
  release:
    types:
      - published

permissions:
  contents: write
  packages: write

jobs:
  publish:
    if: startsWith(github.event.release.tag_name, 'k8s-copycat-chart-v')
    runs-on: ubuntu-latest
    concurrency:
      group: helm-release-${{ github.event.release.tag_name }}
      cancel-in-progress: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.13.3

      - name: Sync chart version with release tag
        run: |
          RAW_TAG="${GITHUB_REF_NAME}"
          TAG="${RAW_TAG##*-v}"
          echo "Setting chart version to ${TAG}"
          sed -i -E "s/^version: .*/version: ${TAG} # replaced by CI/" Chart.yaml

      - name: Validate chart version
        run: |
          RAW_TAG="${GITHUB_REF_NAME}"
          TAG="${RAW_TAG##*-v}"
          grep -Eq "^version: ${TAG}([[:space:]]+#.*)?$" Chart.yaml || { echo "Chart version mismatch"; cat Chart.yaml; exit 1; }
      - name: Package chart
        run: |
          mkdir -p dist
          helm dependency update .
          helm package . --destination dist

      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username ${{ github.actor }} --password-stdin

      - name: Push chart to GHCR
        run: |
          OCI_REGISTRY="oci://ghcr.io/${GITHUB_REPOSITORY,,}"
          for chart in dist/*.tgz; do
            helm push "$chart" "$OCI_REGISTRY"
          done

      - name: Upload packaged chart to release assets
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.tgz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

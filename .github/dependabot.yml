version: 2
updates:

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "07:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: "scope"
    labels: ["dependencies", "ci"]

  - package-ecosystem: "helm"
    directory: "/"
    schedule:
      interval: "daily"
      time: "07:05"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: "scope"
    labels: ["dependencies", "helm-chart"]

  # NOTE: appVersion tracking for ghcr.io/matzegebbe/k8s-copycat is handled by
  # .github/workflows/update-appversion.yml because Dependabot's Docker ecosystem
  # only parses Dockerfiles, not Helm Chart.yaml appVersion fields.
